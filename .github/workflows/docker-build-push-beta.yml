name: docker-push-beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像 tag（留空则读取 service/assets/version 中的版本号）'
        required: false
        default: '1.8.1-beta'
  # 暂时取消自动编译，优化后重新开启
  # push:
  #   tags:
  #     - 'v*'

# 推送到 GitHub Container Registry 需要 packages: write
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Resolve image tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # GHCR 要求镜像名全小写
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          version="${INPUT_VERSION}"
          if [ -z "${version}" ]; then
            version="$(cut -d '|' -f 2 ./service/assets/version | tr -d '[:space:]')"
          fi

          if ! printf '%s' "${version}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::镜像 tag 不合法: '${version}'，只允许字母数字与 _ . -，且不能以符号开头"
            exit 1
          fi

          echo "APP_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "APP_TAGS=${image}:${version}" >> "$GITHUB_ENV"
          echo "镜像: ${image}"
          echo "标签: ${image}:${version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .  # 这里在项目根目录找Dockerfile构建
          platforms: linux/amd64,linux/arm,linux/arm64
          push: true
          tags: ${{ env.APP_TAGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
