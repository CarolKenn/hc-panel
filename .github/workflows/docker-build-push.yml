name: docker-push

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像 tag（留空则读取 service/assets/version 中的版本号）'
        required: false
        default: '1.8.1-export'
      push_latest:
        description: '同时推送 latest 标签'
        type: boolean
        required: false
        default: false
  # 暂时取消自动编译，优化后重新开启
  # push:
  #   tags:
  #     - 'v*'

# 推送到 GitHub Container Registry 需要 packages: write
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Resolve image tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          # GHCR 要求镜像名全小写，仓库名含大写时需转换
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          version="${INPUT_VERSION}"
          if [ -z "${version}" ]; then
            version="$(cut -d '|' -f 2 ./service/assets/version | tr -d '[:space:]')"
          fi

          if ! printf '%s' "${version}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::镜像 tag 不合法: '${version}'，只允许字母数字与 _ . -，且不能以符号开头"
            exit 1
          fi

          tags="${image}:${version}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            tags="${tags},${image}:latest"
          fi

          echo "APP_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "APP_TAGS=${tags}" >> "$GITHUB_ENV"
          echo "镜像: ${image}"
          echo "版本号: ${version}"
          echo "标签: ${tags}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check GHCR credentials
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "${GHCR_PAT}" ]; then
            echo "::warning::未配置 secrets.GHCR_PAT，将使用 GITHUB_TOKEN 推送；若包尚不存在或未授权给本仓库，GHCR 会返回 write_package 拒绝"
          else
            echo "使用 secrets.GHCR_PAT 推送"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          # 优先用 secrets.GHCR_PAT（classic PAT，需 write:packages），否则回落到 GITHUB_TOKEN
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .  # 这里在项目根目录找Dockerfile构建
          platforms: linux/amd64,linux/arm,linux/arm64
          push: true
          tags: ${{ env.APP_TAGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
