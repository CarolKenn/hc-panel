version: "3.2"

services:
  sun-panel:
    # 本仓库构建并发布到 GHCR 的镜像；拉取前需 docker login ghcr.io
    image: 'ghcr.io/carolkenn/hc-panel:1.8.1-export'
    container_name: sun-panel
    volumes:
    - ./conf:/app/conf
    - ./uploads:/app/uploads
    - ./database:/app/database
    # - ./runtime:/app/runtime
    ports:
    - 3002:3002
    restart: always